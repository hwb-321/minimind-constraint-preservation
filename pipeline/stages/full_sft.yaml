script: trainer/train_full_sft.py
distributed: true
runtime:
  nproc_per_node: 1
  master_port: 29501
  cuda_visible_devices: ""
args:
  save_dir: ./models
  tokenizer_path: ./model
  hidden_size: 768
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 4
  intermediate_size: 2432
  rms_norm_eps: 0.000001
  save_weight: baseline_full_sft
  from_weight: baseline_pretrain
  use_wandb: false
  wandb_project: MiniMind-3-Zero-Full-SFT
  data_path: ./dataset/sft_t2t_mini.jsonl
  epochs: 2
  batch_size: 16
  learning_rate: 0.00001
  max_seq_len: 768
  accumulation_steps: 1
  num_workers: 8
  save_interval: 1000
  log_interval: 1
